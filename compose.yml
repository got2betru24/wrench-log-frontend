name: wrench-log
services:
  frontend:
    container_name: wrench-log-frontend
    image: wrench-log-frontend
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-dev
    volumes:
      - ./:/app/frontend
      - /app/frontend/node_modules
    environment:
      - VITE_API_BASE_URL=http://wrench-log.local/api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wrench-log-frontend.rule=Host(`wrench-log.local`)"
      - "traefik.http.routers.wrench-log-frontend.priority=1"
      - "traefik.http.services.wrench-log-frontend.loadbalancer.server.port=5173"
      - "traefik.http.routers.wrench-log-frontend.entrypoints=web"
    expose:
      - 5173
    networks:
      - traefik-network
    restart: unless-stopped

networks:
  traefik-network:
    external: true
